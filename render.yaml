databases:
  - name: erp-db
    plan: free
    databaseName: erp
    user: erp

services:
  - type: web
    name: erp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: e2e
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:4200
